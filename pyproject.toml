[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermeter"
version = "0.1.0"
description = "Build combined water meter data workbooks and professional reports from Excel and PlanRadar."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Simon Wand" }]
dependencies = [
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<12",
  "playwright>=1.54,<2",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watermeter = ["reporting/templates/*.j2", "reporting/templates/*.css", "reporting/templates/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
